name: Verify PS1 direct-source M6 final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-canonical-baseline.yml

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout final M6 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-retire-install-runtime-m6

      - name: Run active PS1 architecture gate
        shell: bash
        run: cmake -DJOJO_SOURCE_DIR="$PWD" -P cmake/CheckPs1ActiveArchitecture.cmake

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all
        run: cmake --build build -j2

      - name: Run complete CTest suite
        run: ctest --test-dir build --output-on-failure

  windows-regression:
    runs-on: windows-2022
    steps:
      - name: Checkout final M6 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-retire-install-runtime-m6

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build all Release targets
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run complete CTest suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
