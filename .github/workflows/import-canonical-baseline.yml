name: Verify PS1 install-runtime retirement M6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-canonical-baseline.yml

permissions:
  contents: write

jobs:
  integrate-and-verify-m6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M6 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-retire-install-runtime-m6
          fetch-depth: 0

      - name: Retire legacy install runtime from shipping graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          for line in [
              '  src/core/ps1_installation.cpp\n',
              '  src/core/conversion.cpp\n',
              'add_jojo_test(jojo_ps1_manifest_tests tests/test_ps1_manifest.cpp)\n',
              'add_jojo_test(jojo_ps1_installation_tests tests/test_ps1_installation.cpp)\n',
              'add_jojo_test(jojo_ps1_conversion_tests tests/test_ps1_conversion.cpp)\n',
              'add_jojo_test(jojo_ps1_runtime_installation_tests tests/test_ps1_runtime_installation.cpp)\n',
              'add_jojo_test(jojo_ps1_local_evidence_tests tests/test_ps1_local_evidence.cpp)\n',
          ]:
              text = text.replace(line, '')
          cmake.write_text(text)

          settings_h = Path('src/core/settings.h')
          text = settings_h.read_text()
          text = text.replace('    std::string install_root{};\n', '')
          settings_h.write_text(text)

          settings_cpp = Path('src/core/settings.cpp')
          text = settings_cpp.read_text()
          old = (
              '        if (key == "install_root") result.install_root = value;\n'
              '        else if (key == "install_dir" && result.install_root.empty()) result.install_root = value;\n'
              '        else if (key == "source_binding_path") result.source_binding_path = value;\n'
          )
          new = '        if (key == "source_binding_path") result.source_binding_path = value;\n'
          if old not in text:
              raise SystemExit('settings parser legacy block not found')
          text = text.replace(old, new)
          text = text.replace('        out << "install_root=" << settings.install_root << \'\\n\';\n', '')
          settings_cpp.write_text(text)

          test_main = Path('tests/test_main.cpp')
          text = test_main.read_text()
          text = text.replace('    in.install_root = "C:/Games/JOJO-Recompiled";\n', '')
          text = text.replace('        CHECK(loaded.value.install_root == in.install_root);\n', '')
          text = re.sub(
              r'\nstatic void test_legacy_install_dir_migrates_to_install_root\(\) \{.*?\n\}\n',
              '\n', text, flags=re.S)
          text = text.replace('    test_legacy_install_dir_migrates_to_install_root();\n', '')
          test_main.write_text(text)
          PY

          ! grep -q 'src/core/conversion.cpp' CMakeLists.txt
          ! grep -q 'src/core/ps1_installation.cpp' CMakeLists.txt
          ! grep -q 'jojo_ps1_runtime_installation_tests' CMakeLists.txt
          ! grep -q 'jojo_ps1_local_evidence_tests' CMakeLists.txt
          ! grep -q 'install_root' src/core/settings.h
          ! grep -q 'install_root=' src/core/settings.cpp

      - name: Run active PS1 architecture gate
        shell: bash
        run: cmake -DJOJO_SOURCE_DIR="$PWD" -P cmake/CheckPs1ActiveArchitecture.cmake

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all
        run: cmake --build build -j2

      - name: Run complete CTest suite
        run: ctest --test-dir build --output-on-failure

      - name: Commit verified M6 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JOJO Recompiled CI'
          git config user.email 'actions@users.noreply.github.com'
          git add CMakeLists.txt src/core/settings.h src/core/settings.cpp tests/test_main.cpp src/core/runtime.h src/core/runtime.cpp cmake/CheckPs1ActiveArchitecture.cmake
          if git diff --cached --quiet; then
            echo 'No M6 changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: retire legacy PS1 install runtime from shipping'
          git push origin HEAD:feature/ps1-retire-install-runtime-m6
