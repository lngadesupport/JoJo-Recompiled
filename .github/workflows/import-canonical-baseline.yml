name: Verify Win32 direct-source M4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-canonical-baseline.yml

permissions:
  contents: write

jobs:
  verify-m4:
    runs-on: windows-2022
    steps:
      - name: Checkout M4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-win32-direct-source-m4
          fetch-depth: 0

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build shipping app and M4 contract
        shell: pwsh
        run: cmake --build build --config Release --target jojo_recompiled jojo_win32_image_selection_tests

      - name: Run M4 Win32 contract
        shell: pwsh
        run: ctest --test-dir build -C Release -R jojo_win32_image_selection_tests --output-on-failure
