name: Verify Win32 direct-source M4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-canonical-baseline.yml

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-win32-direct-source-m4

      - name: Guard direct-source entry point
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'convert_image(' src/app_win32/main.cpp
          ! grep -q 'ID_INSTALL_PATH' src/app_win32/main.cpp
          ! grep -q 'ID_SELECT_INSTALL' src/app_win32/main.cpp
          grep -q 'bootstrap_runtime_checkpoint_from_disc_to_file' src/app_win32/main.cpp
          grep -q 'resolve_startup_source' src/app_win32/main.cpp

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all
        run: cmake --build build -j2

      - name: Run complete CTest suite
        run: ctest --test-dir build --output-on-failure

  windows-regression:
    runs-on: windows-2022
    steps:
      - name: Checkout M4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-win32-direct-source-m4

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build all Release targets
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run complete CTest suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
