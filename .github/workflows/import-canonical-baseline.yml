name: Verify PS1 install-runtime retirement M6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-canonical-baseline.yml

permissions:
  contents: read

jobs:
  architecture-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M6 branch
        uses: actions/checkout@v4
        with:
          ref: feature/ps1-retire-install-runtime-m6

      - name: Run active PS1 architecture gate
        shell: bash
        run: cmake -DJOJO_SOURCE_DIR="$PWD" -P cmake/CheckPs1ActiveArchitecture.cmake
