name: Phase 2 Commercial Frontier

on:
  push:
    branches:
      - feature/ps1-commercial-boot-phase2

permissions:
  contents: read

jobs:
  linux-full-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Guard shipping Phase 2 integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Ps1CommercialEvidenceRunner' src/app_win32/main.cpp
          grep -q 'commercial-frontier.txt' src/app_win32/main.cpp
          ! grep -q 'bootstrap_runtime_checkpoint_from_disc_to_file' src/app_win32/main.cpp
      - name: Active PS1 architecture gate
        shell: bash
        run: cmake -DJOJO_SOURCE_DIR="$PWD" -P cmake/CheckPs1ActiveArchitecture.cmake
      - name: Configure Release
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build full graph
        run: cmake --build build-linux -j2
      - name: Run full CTest graph
        run: ctest --test-dir build-linux --output-on-failure

  windows-x64-full-gate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release x64
        run: cmake -S . -B build-win -A x64
      - name: Build full graph
        run: cmake --build build-win --config Release
      - name: Run full CTest graph
        run: ctest --test-dir build-win -C Release --output-on-failure
