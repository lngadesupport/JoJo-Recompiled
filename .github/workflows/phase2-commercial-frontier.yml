name: Phase 2 Commercial Frontier

on:
  push:
    branches:
      - feature/ps1-commercial-boot-phase2

permissions:
  contents: read

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Guard shipping Phase 2 integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Ps1CommercialEvidenceRunner' src/app_win32/main.cpp
          grep -q 'commercial-frontier.txt' src/app_win32/main.cpp
          ! grep -q 'bootstrap_runtime_checkpoint_from_disc_to_file' src/app_win32/main.cpp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build Phase 2 contracts
        run: cmake --build build --target jojo_ps1_commercial_frontier_tests jojo_ps1_commercial_evidence_tests jojo_ps1_commercial_evidence_io_tests -j2
      - name: Run Phase 2 contracts
        run: ctest --test-dir build -R 'jojo_ps1_commercial_(frontier|evidence|evidence_io)_tests' --output-on-failure
