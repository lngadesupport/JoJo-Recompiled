name: Phase 3 Final Gate

on:
  push:
    branches:
      - feature/ps1-hardware-services-phase3

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Guard Phase 3 architecture
        shell: bash
        run: |
          set -euo pipefail
          cmake -DJOJO_SOURCE_DIR="$PWD" -P cmake/CheckPs1ActiveArchitecture.cmake
          grep -q 'Ps1HardwareServices' src/core/ps1_memory_bus.h
          grep -q 'attach_disc' src/core/ps1_hardware_services.h
          grep -q 'Ps1GpuIngress' src/core/ps1_hardware_services.h
          grep -q 'Ps1CdromController' src/core/ps1_hardware_services.h
          ! grep -q 'convert_image' src/app_win32/main.cpp
          ! grep -q 'boot.psxexe' src/app_win32/main.cpp
          ! grep -q 'diagnostic_mmio_probe = true' src/app_win32/main.cpp
      - name: Configure Release
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build full graph
        run: cmake --build build-linux -j2
      - name: Run Phase 3 integration first
        run: ctest --test-dir build-linux -R jojo_ps1_hardware_integration_tests --output-on-failure
      - name: Run full CTest graph
        run: ctest --test-dir build-linux --output-on-failure

  windows-x64-full:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release x64
        run: cmake -S . -B build-win -A x64
      - name: Build full graph
        run: cmake --build build-win --config Release
      - name: Run Phase 3 integration first
        run: ctest --test-dir build-win -C Release -R "jojo_ps1_hardware_integration_tests" --output-on-failure
      - name: Run full CTest graph
        run: ctest --test-dir build-win -C Release --output-on-failure
