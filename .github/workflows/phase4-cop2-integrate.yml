name: Phase 4 COP2 Integrate

on:
  push:
    branches:
      - feature/ps1-gpu-gte-first-frame-phase4

permissions:
  contents: write

jobs:
  integrate-cop2:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal COP2 transfer implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/r3000a_reference_executor.cpp')
          s = p.read_text()
          old = '''        case MipsOp::mfc2:
        case MipsOp::cfc2:
        case MipsOp::mtc2:
        case MipsOp::ctc2:
        case MipsOp::cop2_command:
            if ((state.cop0.status & kStatusCu2) == 0u) {
                return enter_exception(state, R3000aExceptionCode::coprocessor_unusable,
                                       R3000aStage::cop2, instruction_pc, current_delay,
                                       instruction.raw, std::nullopt, 2u);
            } else {
                auto result = boundary(state, R3000aBoundaryCode::cop2_unimplemented,
                                       R3000aStage::cop2, instruction_pc, instruction.raw);
                result.diagnostic.coprocessor = 2u;
                return result;
            }
'''
          new = '''        case MipsOp::mfc2:
        case MipsOp::cfc2:
        case MipsOp::mtc2:
        case MipsOp::ctc2:
            if ((state.cop0.status & kStatusCu2) == 0u) {
                return enter_exception(state, R3000aExceptionCode::coprocessor_unusable,
                                       R3000aStage::cop2, instruction_pc, current_delay,
                                       instruction.raw, std::nullopt, 2u);
            }
            switch (instruction.op) {
                case MipsOp::mfc2:
                    queue_load(instruction.rt, state.gte.data[instruction.rd]);
                    break;
                case MipsOp::cfc2:
                    queue_load(instruction.rt, state.gte.control[instruction.rd]);
                    break;
                case MipsOp::mtc2:
                    state.gte.data[instruction.rd] = rt;
                    break;
                case MipsOp::ctc2:
                    state.gte.control[instruction.rd] = rt;
                    break;
                default:
                    break;
            }
            break;
        case MipsOp::cop2_command:
            if ((state.cop0.status & kStatusCu2) == 0u) {
                return enter_exception(state, R3000aExceptionCode::coprocessor_unusable,
                                       R3000aStage::cop2, instruction_pc, current_delay,
                                       instruction.raw, std::nullopt, 2u);
            } else {
                auto result = boundary(state, R3000aBoundaryCode::cop2_unimplemented,
                                       R3000aStage::cop2, instruction_pc, instruction.raw);
                result.diagnostic.coprocessor = 2u;
                return result;
            }
'''
          if old not in s:
              raise SystemExit('expected COP2 block not found; refusing broad edit')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build focused regression
        run: cmake --build build --target jojo_r3000a_cop2_tests jojo_r3000a_cop0_tests jojo_r3000a_exception_tests jojo_r3000a_boundary_tests -j2
      - name: Run focused regression
        run: ctest --test-dir build -R 'jojo_r3000a_(cop2|cop0|exception|boundary)_tests' --output-on-failure
      - name: Commit verified implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration diff to commit.'
            exit 0
          fi
          git config user.name 'TheTeu'
          git config user.email 'kingmath3us@gmail.com'
          git add src/core/r3000a_reference_executor.cpp
          git commit -m 'feat: add PS1 COP2 GTE register transfers [skip ci]'
          git push origin HEAD:feature/ps1-gpu-gte-first-frame-phase4
