name: Phase 4 COP2 Gate

on:
  push:
    branches:
      - feature/ps1-gpu-gte-first-frame-phase4

permissions:
  contents: read

jobs:
  cop2-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build COP2 contract
        run: cmake --build build --target jojo_r3000a_cop2_tests -j2
      - name: Run COP2 contract
        run: ctest --test-dir build -R '^jojo_r3000a_cop2_tests$' --output-on-failure
