name: Phase 4 Display Frame RED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-frame-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile display-frame contract directly
        run: >-
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc
          tests/test_ps1_display_frame.cpp
          src/core/ps1_gpu_ingress.cpp
          src/core/ps1_display_frame.cpp
          -o /tmp/jojo_display_frame_test
      - name: Run display-frame contract
        run: /tmp/jojo_display_frame_test
