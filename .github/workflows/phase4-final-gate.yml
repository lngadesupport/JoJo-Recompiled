name: Phase 4 Final Gate

on:
  push:
    branches:
      - feature/ps1-gpu-gte-first-frame-phase4

permissions:
  contents: read

jobs:
  linux-release-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Guard direct-source architecture
        shell: bash
        run: |
          set -euo pipefail
          cmake -DJOJO_SOURCE_DIR="$PWD" -P cmake/CheckPs1ActiveArchitecture.cmake
          grep -q 'src/core/ps1_gte.cpp' CMakeLists.txt
          grep -q 'src/core/ps1_display_frame.cpp' CMakeLists.txt
          grep -q 'jojo_ps1_gte_tests' CMakeLists.txt
          ! grep -q 'convert_image' src/app_win32/main.cpp
          ! grep -q 'boot.psxexe' src/app_win32/main.cpp
      - name: Configure Release
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build full graph
        run: cmake --build build-linux -j2
      - name: Run Phase 4 focus
        run: >-
          ctest --test-dir build-linux -R
          "jojo_(r3000a_cop2|ps1_(gte|gpu_ingress|gpu_vram|display_frame|boot_runtime|commercial_evidence.*))_tests"
          --output-on-failure
      - name: Run full CTest
        run: ctest --test-dir build-linux --output-on-failure

  windows-x64-release-full:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release x64
        run: cmake -S . -B build-win -A x64
      - name: Build full graph
        run: cmake --build build-win --config Release
      - name: Run Phase 4 focus
        run: >-
          ctest --test-dir build-win -C Release -R
          "jojo_(r3000a_cop2|ps1_(gte|gpu_ingress|gpu_vram|display_frame|boot_runtime|commercial_evidence.*)|win32_presentation)_tests"
          --output-on-failure
      - name: Run full CTest
        run: ctest --test-dir build-win -C Release --output-on-failure
