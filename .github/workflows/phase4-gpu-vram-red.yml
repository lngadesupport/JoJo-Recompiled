name: Phase 4 GPU VRAM RED

on:
  push:
    branches:
      - feature/ps1-gpu-gte-first-frame-phase4

permissions:
  contents: read

jobs:
  gpu-vram-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile VRAM contract directly
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tests/test_ps1_gpu_vram.cpp src/core/ps1_gpu_ingress.cpp -o /tmp/jojo_gpu_vram_test
      - name: Run VRAM contract
        run: /tmp/jojo_gpu_vram_test
