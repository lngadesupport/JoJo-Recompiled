name: Phase 4 Runtime Display Frame

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-display-frame-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build focused boot runtime regression
        run: cmake --build build --target jojo_ps1_boot_runtime_tests -j2
      - name: Run focused boot runtime regression
        run: ctest --test-dir build -R '^jojo_ps1_boot_runtime_tests$' --output-on-failure
