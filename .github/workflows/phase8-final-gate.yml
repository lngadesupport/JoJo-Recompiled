name: Phase 8 Final Gate

on:
  push:
    branches:
      - feature/ps1-native-x64-phase8-prep
  pull_request:
    branches:
      - feature/ps1-native-x64-phase8-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-commercial-probe-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build-probe -DCMAKE_BUILD_TYPE=Release
      - name: Build commercial probe
        run: cmake --build build-probe --target jojo_ps1_commercial_probe -j2
      - name: Upload commercial probe
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-Phase8-Linux-Commercial-Probe
          path: build-probe/jojo_ps1_commercial_probe
          if-no-files-found: error

  windows-commercial-probe-artifact:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release x64
        run: cmake -S . -B build-probe-win -A x64
      - name: Build commercial probe
        run: cmake --build build-probe-win --config Release --target jojo_ps1_commercial_probe
      - name: Upload commercial probe
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-Phase8-Windows-x64-Commercial-Probe
          path: build-probe-win/Release/jojo_ps1_commercial_probe.exe
          if-no-files-found: error

  linux-release-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build full graph
        run: cmake --build build-linux -j2
      - name: Run Phase 8 focus
        run: >-
          ctest --test-dir build-linux -R
          "jojo_(mips_decoder|r3000a_(ir|cfg|native_plan|native_alu|x64|x64_cache|dispatch|integer|control_flow|memory)|ps1_(native_runtime|boot_report_io|commercial_evidence_io))_tests"
          --output-on-failure
      - name: Run full CTest
        run: ctest --test-dir build-linux --output-on-failure

  windows-x64-release-full:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release x64
        run: cmake -S . -B build-win -A x64
      - name: Build full graph
        run: cmake --build build-win --config Release
      - name: Run Phase 8 focus
        run: >-
          ctest --test-dir build-win -C Release -R
          "jojo_(mips_decoder|r3000a_(ir|cfg|native_plan|native_alu|x64|x64_cache|dispatch|integer|control_flow|memory)|ps1_(native_runtime|boot_report_io|commercial_evidence_io))_tests"
          --output-on-failure
      - name: Run full CTest
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: Upload playable Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-Recompiled-Phase8-Windows-x64-Test
          path: |
            build-win/Release/JOJO-Recompiled.exe
            build-win/Release/assets/launcher/jojo_launcher_main.jpg
            build-win/Release/jojo_online_directory_server.exe
          if-no-files-found: error
